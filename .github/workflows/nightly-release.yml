name: Auto Build on Push

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # gradle-wrapper.properties 配的是腾讯云镜像（国内快），但 GitHub 托管 runner 在海外，
      # 下该镜像会 Read timed out，所以只在 CI 里换成官方源。
      - name: Use official Gradle distribution in CI
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25 (compile toolchain)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Gradle 8.4 / Groovy 3.0.17 无法在 Java 25 上运行（Unsupported class file major version 69，
      # Gradle 官方矩阵要求 9.1.0+ 才能跑 Java 25），所以让 Gradle 自身用 JDK 17 跑，
      # 编译目标仍由上面 step 提供的 JDK 25 toolchain 完成。
      - name: Set up JDK 17 (run Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shadowJar
        run: ./gradlew shadowJar -Dorg.gradle.java.installations.paths="${{ steps.jdk25.outputs.path }}"
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Artifacts with Commit Hash
        run: |
          echo "Current Commit Hash: ${{ steps.vars.outputs.sha_short }}"
          cd build/libs
          
          for file in *.jar; do
            if [[ "$file" != *"-source.jar" ]]; then
              filename="${file%.*}"
              extension="${file##*.}"
              # 这里的格式是: 原名+CommitHash.jar
              mv "$file" "${filename}+${{ steps.vars.outputs.sha_short }}.${extension}"
            fi
          done
          
          # Can Can Need Result
          ls -l

      # 这一步是为了删除之前的文件
      - name: Delete Old Release
        # 使用 || true 忽略错误，防止第一次运行时因为没有 release 而报错
        run: gh release delete latest-dev --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev       # 固定的 Tag 名字
          name: "Latest Development Build"
          body: "Auto-build from commit: ${{ github.sha }}"
          prerelease: true           # 标记为预发布
          files: build/libs/*.jar    # 上传刚才改名后的文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}