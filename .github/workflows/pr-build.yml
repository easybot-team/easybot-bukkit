name: PR Build

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use official Gradle distribution in CI
        run: sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java 25 (compile toolchain)
        id: jdk25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Gradle 8.4 runs on Java 17; compilation uses the Java 25 toolchain.
      - name: Set up Java 17 (run Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: ./gradlew shadowJar --stacktrace -Dorg.gradle.java.installations.paths="${{ steps.jdk25.outputs.path }}"
